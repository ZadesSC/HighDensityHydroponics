name: Shared RimWorld release

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        default: ''
      tooling-ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/rimworld-ci.yml
    with:
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      tooling-ref: ${{ inputs.tooling-ref }}

  publish:
    if: inputs.channel != 'dev'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
      - name: Verify and publish the exact validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT: ${{ needs.package.outputs.commit }}
          MOD_SLUG: ${{ needs.package.outputs.slug }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          flags=(--latest)
          if [[ "$CHANNEL" == prerelease ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" dist/*.zip dist/SHA256SUMS \
            --target "$COMMIT" --title "$MOD_SLUG $VERSION" --notes-file release-notes.txt --generate-notes "${flags[@]}"
