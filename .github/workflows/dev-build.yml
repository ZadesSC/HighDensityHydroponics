name: Build dev package

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ZadesSC/HighDensityHydroponics/.github/workflows/rimworld-ci.yml@38ed54a44ad945a31a98b4e622e375630cbe1b8f
    with:
      channel: dev
      tooling-ref: 38ed54a44ad945a31a98b4e622e375630cbe1b8f
