name: Build dev package

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ZadesSC/HighDensityHydroponics/.github/workflows/rimworld-ci.yml@b1568f2acc098c2c3b89cdacea96a2b18ebe929c
    with:
      channel: dev
      tooling-ref: b1568f2acc098c2c3b89cdacea96a2b18ebe929c
